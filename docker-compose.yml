services:
  interview-loop:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./interview_sessions:/app/interview_sessions
      - ./面试记录:/app/面试记录
    restart: unless-stopped

  interview-loop-api:
    build: .
    env_file:
      - .env
    command: uvicorn interview_loop.api.main:app --host 0.0.0.0 --port 8000
    environment:
      INTERVIEWLOOP_DB_PATH: /app/data/interview_loop.db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
